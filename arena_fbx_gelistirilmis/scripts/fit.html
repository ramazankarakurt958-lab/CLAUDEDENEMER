<script type="module">import*as T from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';

 for(let y=0;y<W;y++)for(let x=0;x<W;x++){const a=px[4*((W-1-y)*W+x)]<128?1:0,b=ref[y*W+x];I+=a&b;U+=a|b}return I/U}
